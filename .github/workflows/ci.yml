name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      STAROCEAN_TEST_DSN: sqlite:/tmp/starocean_ci.db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: templ generate (consistency)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          templ generate
          git diff --quiet --exit-code -- 'view/**/*_templ.go' || {
            echo "::error::templ output stale, run 'make templ' and commit"
            exit 1
          }

      - name: go vet
        run: go vet ./...

      # 集成测试连接失败一律 Fatal（静默 Skip 即假绿）。
      # DDL dump 工具用 go:build dumpddl，不在默认 ./... 中，故无 Skip 白名单。
      - name: go test (race)
        run: |
          go test -race -count=1 -v ./... 2>&1 | tee /tmp/gotest.log
          status=${PIPESTATUS[0]}
          if grep -E '^[[:space:]]*--- SKIP' /tmp/gotest.log; then
            echo "::error::unexpected test SKIP (silent skip = false green)"
            exit 1
          fi
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m ./...
