---
name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Database backend
      options: [SQLite, PostgreSQL]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1. ... 2. ... 3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: DO NOT paste SECRET_KEY, passwords, or tokens.
      render: text
